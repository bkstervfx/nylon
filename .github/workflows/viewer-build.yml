name: viewer-build

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "build-viewer.cmd"
      - "view.cmd"
      - ".github/workflows/viewer-build.yml"
  pull_request:
    paths:
      - "viewer/**"
      - "build-viewer.cmd"
      - "view.cmd"
      - ".github/workflows/viewer-build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Nylon portable toolchain
        shell: cmd
        run: build.cmd

      - name: Build full Atlas viewer
        shell: cmd
        run: build-viewer.cmd

      - name: Verify viewer executable
        shell: pwsh
        run: |
          if (-not (Test-Path "bin\nylon-viewer.exe")) { throw "bin\nylon-viewer.exe was not produced" }
          if (-not (Test-Path "bin\nylon-viewer.atlas-v1")) { throw "full Atlas viewer marker was not produced" }
          $size = (Get-Item "bin\nylon-viewer.exe").Length
          if ($size -lt 100000) { throw "nylon-viewer.exe is unexpectedly small: $size bytes" }

      - name: Smoke-test read-only Atlas viewer API
        shell: pwsh
        run: |
          @'
          import sqlite3
          db = sqlite3.connect(r"viewer-smoke.db")
          db.executescript("""
          CREATE TABLE metadata(meta_key TEXT PRIMARY KEY, value TEXT NOT NULL);
          CREATE TABLE registry_hives(id INTEGER PRIMARY KEY, name TEXT NOT NULL, source_path TEXT NOT NULL, required INTEGER NOT NULL);
          CREATE TABLE registry_keys(id INTEGER PRIMARY KEY, hive_id INTEGER NOT NULL, parent_id INTEGER, cell_offset INTEGER NOT NULL, name TEXT NOT NULL, path TEXT NOT NULL);
          CREATE TABLE registry_values(id INTEGER PRIMARY KEY, key_id INTEGER NOT NULL, name TEXT NOT NULL, value_type INTEGER NOT NULL, data BLOB NOT NULL, text_value TEXT);
          CREATE INDEX registry_key_parent_index ON registry_keys(parent_id);
          CREATE INDEX registry_value_key_index ON registry_values(key_id);
          INSERT INTO metadata VALUES('schema_version','2');
          INSERT INTO metadata VALUES('source_image_name','Viewer smoke image');
          INSERT INTO metadata VALUES('source_kind','test');
          INSERT INTO registry_hives VALUES(1,'SOFTWARE','Windows\\System32\\config\\SOFTWARE',1);
          INSERT INTO registry_keys VALUES(1,1,NULL,32,'ROOT','SOFTWARE');
          INSERT INTO registry_keys VALUES(2,1,1,64,'NylonSmoke','SOFTWARE\\NylonSmoke');
          INSERT INTO registry_values VALUES(1,2,'Greeting',1,X'680065006C006C006F000000','hello');
          INSERT INTO registry_values VALUES(2,2,'Number',4,X'2A000000','42');
          """)
          db.commit(); db.close()

          m = sqlite3.connect(r"viewer-smoke.map.db")
          m.executescript("""
          CREATE TABLE metadata(key TEXT PRIMARY KEY,value TEXT NOT NULL);
          CREATE TABLE lift_jobs(id INTEGER PRIMARY KEY,job_key TEXT NOT NULL UNIQUE,mode TEXT NOT NULL,parent_context_id INTEGER,roots TEXT NOT NULL,value_offset INTEGER NOT NULL DEFAULT 0,value_limit INTEGER NOT NULL DEFAULT 0,source_count INTEGER NOT NULL,estimated_bytes INTEGER NOT NULL,path TEXT NOT NULL,deterministic_kind TEXT NOT NULL DEFAULT '',status INTEGER NOT NULL DEFAULT 0,attempts INTEGER NOT NULL DEFAULT 0,input_hash TEXT NOT NULL DEFAULT '',error TEXT NOT NULL DEFAULT '',started_ms INTEGER,completed_ms INTEGER);
          CREATE TABLE semantic_nodes(id INTEGER PRIMARY KEY,stable_key TEXT NOT NULL UNIQUE,job_id INTEGER NOT NULL,parent_id INTEGER,local_id TEXT NOT NULL,kind TEXT NOT NULL,label TEXT NOT NULL,summary TEXT NOT NULL,confidence REAL NOT NULL);
          CREATE TABLE semantic_edges(id INTEGER PRIMARY KEY,job_id INTEGER NOT NULL,source_id INTEGER NOT NULL,relation TEXT NOT NULL,target_id INTEGER NOT NULL);
          CREATE TABLE semantic_sources(semantic_id INTEGER NOT NULL,source_ref TEXT NOT NULL,PRIMARY KEY(semantic_id,source_ref));
          CREATE TABLE unresolved(id INTEGER PRIMARY KEY,job_id INTEGER NOT NULL,text TEXT NOT NULL);
          INSERT INTO metadata VALUES('complete','0');
          INSERT INTO metadata VALUES('model_name','Qwen3.5-4B-Q8_0');
          INSERT INTO lift_jobs(id,job_key,mode,roots,source_count,estimated_bytes,path,deterministic_kind,status,attempts) VALUES(1,'smoke','subtree','2',3,512,'SOFTWARE\\NylonSmoke','',3,1);
          INSERT INTO semantic_nodes VALUES(1,'j1:group',1,NULL,'group','registry_configuration','Nylon Smoke Configuration','Example semantic group.',0.8);
          INSERT INTO semantic_nodes VALUES(2,'j1:e1',1,1,'e1','component','NylonSmoke','Example normalized component.',0.8);
          INSERT INTO semantic_edges VALUES(1,1,1,'contains',2);
          INSERT INTO semantic_sources VALUES(2,'rk:2');
          """)
          m.commit(); m.close()
          '@ | python -

          $process = Start-Process -FilePath ".\bin\nylon-viewer.exe" -ArgumentList ".\viewer-smoke.db" -PassThru
          try {
            $port = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $listener = Get-NetTCPConnection -State Listen -OwningProcess $process.Id -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -eq '127.0.0.1' } | Select-Object -First 1
              if ($listener) { $port = $listener.LocalPort; break }
              if ($process.HasExited) { throw "viewer exited before opening localhost server (exit $($process.ExitCode))" }
            }
            if (-not $port) { throw "viewer did not open a localhost listener" }
            $base = "http://127.0.0.1:$port"
            $info = Invoke-RestMethod "$base/api/info"
            if ($info.schema -ne '2' -or $info.keys -ne 2 -or $info.values -ne 2) { throw "unexpected /api/info response" }
            $node = Invoke-RestMethod "$base/api/node?id=rv%3A1"
            if ($node.typeName -ne 'REG_SZ' -or $node.text -ne 'hello') { throw "raw registry detail endpoint failed" }
            $semantic = Invoke-RestMethod "$base/api/semantic/status"
            if (-not $semantic.available -or $semantic.jobs -ne 1 -or $semantic.mapped -ne 3) { throw "semantic status endpoint failed" }
            $jobs = @(Invoke-RestMethod "$base/api/semantic/jobs")
            if ($jobs.Count -ne 1 -or $jobs[0].label -ne 'Nylon Smoke Configuration') { throw "Atlas jobs endpoint failed" }
            $detail = Invoke-RestMethod "$base/api/semantic/job?id=1"
            if ($detail.nodes.Count -ne 2) { throw "semantic detail endpoint failed" }
            $html = Invoke-WebRequest "$base/" -UseBasicParsing
            foreach ($token in @('atlasCanvas','progressCanvas','Full image atlas','>Atlas<','>Raw<','>Progress<')) {
              if ($html.Content -notmatch [regex]::Escape($token)) { throw "Atlas HTML missing $token" }
            }
            Write-Host "Full Atlas viewer smoke test passed on localhost:$port"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
