name: portable-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with portable LLVM-MinGW toolchain
        shell: pwsh
        run: |
          $path = Join-Path $PWD.Path 'build.cmd'
          $source = [System.IO.File]::ReadAllText($path)
          $patched = $source -replace 'call :ensure_wimlib\r?\nif errorlevel 1 exit /b 1', 'rem CI skips runtime-only wimlib bootstrap'
          if ($patched -eq $source) {
            throw 'Unable to isolate runtime-only wimlib bootstrap from CI build'
          }
          [System.IO.File]::WriteAllText($path, $patched)
          & cmd.exe /d /c build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify executable
        shell: cmd
        run: if not exist bin\nylon.exe exit /b 1

      - name: Verify raw namespace foundation
        shell: cmd
        run: test-foundation.cmd

      - name: Smoke-test ISO hashing path
        shell: cmd
        run: |
          echo deliberately-not-an-iso> smoke.iso
          bin\nylon.exe scan smoke.iso > iso-smoke-output.txt 2>&1
          if not errorlevel 1 exit /b 1
          findstr /C:"input..." iso-smoke-output.txt >nul
          if errorlevel 1 (type iso-smoke-output.txt & exit /b 1)
          findstr /C:"Portable wimlib runtime is missing" iso-smoke-output.txt >nul
          if errorlevel 1 (type iso-smoke-output.txt & exit /b 1)
          exit /b 0

      - name: Smoke-test persistent immutable cache long-path verification
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText((Join-Path $PWD.Path 'cache-smoke.iso'), 'cache-verification')
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $PWD.Path 'cache-smoke.iso')).Hash.ToLowerInvariant()
          $stateRoot = Join-Path $env:LOCALAPPDATA 'Temp\nylon'
          $entry = Join-Path $stateRoot "cache\images\$hash\index-1"
          $config = Join-Path $entry 'image\Windows\System32\config'
          [System.IO.Directory]::CreateDirectory($config) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $config 'SYSTEM'), '')
          [System.IO.File]::WriteAllText((Join-Path $config 'SOFTWARE'), '')
          $manifest = @(
            'format=1'
            'complete=1'
            "iso_sha256=$hash"
            'image_index=1'
            'image_count=1'
            'image_name=Cache smoke'
            'iso_extractor=7zip-26.05'
            'wimlib=1.14.5'
            'wim_apply_flags=--no-acls --no-attributes --rpfix'
            'immutable=1'
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $entry 'manifest.txt'), $manifest)

          $longPath = "\\?\$entry\image\LongPath"
          [System.IO.Directory]::CreateDirectory($longPath) | Out-Null
          $longPaths = @($longPath)
          for ($i = 0; $i -lt 12; ++$i) {
            $longPath = [System.IO.Path]::Combine($longPath, "segment-$i-xxxxxxxxxxxxxxxxxxxxxxxx")
            [System.IO.Directory]::CreateDirectory($longPath) | Out-Null
            $longPaths += $longPath
          }
          $leaf = [System.IO.Path]::Combine($longPath, 'leaf.txt')
          [System.IO.File]::WriteAllText($leaf, 'x')

          $normalPaths = @(
            $entry,
            (Join-Path $entry 'image'),
            (Join-Path $entry 'image\Windows'),
            (Join-Path $entry 'image\Windows\System32'),
            $config,
            (Join-Path $config 'SYSTEM'),
            (Join-Path $config 'SOFTWARE'),
            (Join-Path $entry 'manifest.txt')
          )
          foreach ($path in ($normalPaths + $longPaths + @($leaf))) {
            $attributes = [System.IO.File]::GetAttributes($path)
            [System.IO.File]::SetAttributes($path, $attributes -bor [System.IO.FileAttributes]::ReadOnly)
          }

          $stdout = Join-Path $PWD.Path 'cache-smoke-stdout.txt'
          $stderr = Join-Path $PWD.Path 'cache-smoke-stderr.txt'
          $startInfo = @{
            FilePath = Join-Path $PWD.Path 'bin\nylon.exe'
            ArgumentList = @('scan', (Join-Path $PWD.Path 'cache-smoke.iso'), '--index', '1')
            RedirectStandardOutput = $stdout
            RedirectStandardError = $stderr
            Wait = $true
            PassThru = $true
          }
          $process = Start-Process @startInfo
          $output = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          if ($process.ExitCode -eq 0) {
            Write-Host $output
            throw 'Cache smoke test unexpectedly succeeded'
          }
          if (-not $output.Contains('cache: hit')) {
            Write-Host $output
            throw 'Cache smoke test did not reuse the persistent LocalAppData cache'
          }
          if ($output.Contains('Portable wimlib runtime is missing')) {
            Write-Host $output
            throw 'Cache hit incorrectly required the wimlib runtime'
          }
          if ($output.Contains('Unable to enumerate immutable ISO cache')) {
            Write-Host $output
            throw 'Cache verification failed while traversing a long path'
          }
          if (-not $output.Contains('Image root does not contain Windows\System32\ntoskrnl.exe')) {
            Write-Host $output
            throw 'Cache verification did not advance to image validation'
          }

      - name: Smoke-test scanner database startup
        shell: cmd
        run: |
          mkdir smoke\Windows\System32\config
          type nul > smoke\Windows\System32\ntoskrnl.exe
          for %%H in (SOFTWARE SYSTEM COMPONENTS DEFAULT SAM SECURITY) do type nul > smoke\Windows\System32\config\%%H
          bin\nylon.exe scan smoke > smoke-output.txt 2>&1
          if errorlevel 1 (type smoke-output.txt & exit /b 1)
          findstr /C:"registry..." smoke-output.txt >nul
          if errorlevel 1 (type smoke-output.txt & exit /b 1)
          findstr /C:"NOT NULL constraint failed" smoke-output.txt >nul
          if not errorlevel 1 (type smoke-output.txt & exit /b 1)
          exit /b 0

      - name: Verify invalid hives remain explicit partial evidence
        shell: pwsh
        run: |
          @'
          import sqlite3
          with sqlite3.connect('output/image.db') as db:
              assert db.execute("SELECT state FROM audit_identity").fetchone() == ('PARTIAL',)
              assert db.execute("SELECT count(*) FROM registry_sources WHERE state='PARSE_FAILED'").fetchone()[0] == 4
              assert db.execute("SELECT count(*) FROM registry_sources WHERE state='REDACTED_SENSITIVE'").fetchone()[0] == 2
              assert db.execute("SELECT count(*) FROM registry_keys").fetchone()[0] == 0
              assert db.execute("SELECT discovery_complete,representation_complete FROM collector_runs WHERE collector='filesystem'").fetchone() == (1,1)
              assert db.execute("PRAGMA integrity_check").fetchall() == [('ok',)]
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test optimized registry traversal
        shell: pwsh
        run: |
          $key = 'HKCU\Software\NylonCiSmoke'
          try {
            & reg.exe add "$key\Child" /v Greeting /t REG_SZ /d hello /f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create registry smoke key' }
            & reg.exe add "$key\Child" /v Number /t REG_DWORD /d 42 /f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create registry smoke value' }

            $hive = Join-Path $PWD.Path 'valid-smoke.hiv'
            & reg.exe save $key $hive /y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to save registry smoke hive' }

            $root = Join-Path $PWD.Path 'valid-smoke'
            $config = Join-Path $root 'Windows\System32\config'
            [System.IO.Directory]::CreateDirectory($config) | Out-Null
            [System.IO.File]::WriteAllBytes((Join-Path $root 'Windows\System32\ntoskrnl.exe'), [byte[]]@(0))
            foreach ($name in @('SOFTWARE', 'SYSTEM', 'COMPONENTS', 'DEFAULT', 'SAM', 'SECURITY')) {
              Copy-Item -LiteralPath $hive -Destination (Join-Path $config $name)
            }

            $stdout = Join-Path $PWD.Path 'valid-smoke-stdout.txt'
            $stderr = Join-Path $PWD.Path 'valid-smoke-stderr.txt'
            $process = Start-Process -FilePath (Join-Path $PWD.Path 'bin\nylon.exe') `
              -ArgumentList @('scan', $root) `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait -PassThru
            $output = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
            if ($process.ExitCode -ne 0 -or -not $output.Contains('complete')) {
              Write-Host $output
              throw "Optimized registry traversal smoke failed with exit code $($process.ExitCode)"
            }
          }
          finally {
            & reg.exe delete $key /f 2>$null | Out-Null
          }
