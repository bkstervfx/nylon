name: semantic-build

on:
  push:
    branches: [main]
    paths:
      - "semantic/**"
      - "semantic.cmd"
      - "semantic-setup.cmd"
      - "build-semantic.cmd"
      - ".github/workflows/semantic-build.yml"
  pull_request:
    paths:
      - "semantic/**"
      - "semantic.cmd"
      - "semantic-setup.cmd"
      - "build-semantic.cmd"
      - ".github/workflows/semantic-build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Nylon portable toolchain
        shell: cmd
        run: build.cmd

      - name: Build semantic lifter
        shell: cmd
        run: build-semantic.cmd

      - name: Verify executables
        shell: pwsh
        run: |
          foreach ($exe in @("bin\nylon-semantic.exe", "bin\nylon-semantic-classify.exe", "bin\nylon-semantic-link.exe")) {
            if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          }

      - name: Planner, preclassification, resume, HTTP, validation and hierarchy smoke test
        shell: pwsh
        run: |
          @'
          import sqlite3
          db = sqlite3.connect(r"semantic-smoke.db")
          db.executescript("""
          CREATE TABLE metadata(meta_key TEXT PRIMARY KEY, value TEXT NOT NULL);
          CREATE TABLE registry_hives(id INTEGER PRIMARY KEY, name TEXT NOT NULL, source_path TEXT NOT NULL, required INTEGER NOT NULL);
          CREATE TABLE registry_keys(id INTEGER PRIMARY KEY, hive_id INTEGER NOT NULL, parent_id INTEGER, cell_offset INTEGER NOT NULL, name TEXT NOT NULL, path TEXT NOT NULL);
          CREATE TABLE registry_values(id INTEGER PRIMARY KEY, key_id INTEGER NOT NULL, name TEXT NOT NULL, value_type INTEGER NOT NULL, data BLOB NOT NULL, text_value TEXT);
          CREATE INDEX registry_key_parent_index ON registry_keys(parent_id);
          CREATE INDEX registry_value_key_index ON registry_values(key_id);
          INSERT INTO metadata VALUES('schema_version','2');
          INSERT INTO metadata VALUES('source_image_name','Semantic smoke image');
          INSERT INTO metadata VALUES('source_kind','test');
          INSERT INTO registry_hives VALUES(1,'SYSTEM','Windows\\System32\\config\\SYSTEM',1);
          INSERT INTO registry_keys VALUES(1,1,NULL,32,'SYSTEM','SYSTEM');
          INSERT INTO registry_keys VALUES(2,1,1,64,'ControlSet001','SYSTEM\\ControlSet001');
          INSERT INTO registry_keys VALUES(3,1,2,96,'Services','SYSTEM\\ControlSet001\\Services');
          """)
          key_id = 4
          value_id = 1
          for i in range(48):
              name = f"Svc{i:03d}"
              path = f"SYSTEM\\ControlSet001\\Services\\{name}"
              db.execute("INSERT INTO registry_keys VALUES(?,?,?,?,?,?)", (key_id,1,3,128+key_id,name,path))
              for field, value in [("Start","2"),("Type","16"),("ImagePath",f"C:\\Windows\\System32\\{name}.exe")]:
                  db.execute("INSERT INTO registry_values VALUES(?,?,?,?,?,?)", (value_id,key_id,field,1,b"x",value))
                  value_id += 1
              key_id += 1

          # One intentionally generic branch must remain model-backed.
          unknown_key = key_id
          db.execute("INSERT INTO registry_keys VALUES(?,?,?,?,?,?)", (unknown_key,1,1,9999,'NylonUnknown','SYSTEM\\NylonUnknown'))
          db.execute("INSERT INTO registry_values VALUES(?,?,?,?,?,?)", (value_id,unknown_key,'Meaning',1,b'x','synthetic semantic fixture'))
          value_id += 1
          key_id += 1

          # Oversized COM Interface branch. Built-in planner intentionally does not
          # classify Interface GUIDs, so the separate deterministic preclassifier
          # must convert these work units before any model request is made.
          classes_key = key_id; key_id += 1
          interface_key = key_id; key_id += 1
          guid_key = key_id; key_id += 1
          guid = '{11111111-2222-3333-4444-555555555555}'
          db.execute("INSERT INTO registry_keys VALUES(?,?,?,?,?,?)", (classes_key,1,1,11000,'Classes','SYSTEM\\Classes'))
          db.execute("INSERT INTO registry_keys VALUES(?,?,?,?,?,?)", (interface_key,1,classes_key,11001,'Interface','SYSTEM\\Classes\\Interface'))
          db.execute("INSERT INTO registry_keys VALUES(?,?,?,?,?,?)", (guid_key,1,interface_key,11002,guid,f'SYSTEM\\Classes\\Interface\\{guid}'))
          for i in range(120):
              db.execute("INSERT INTO registry_values VALUES(?,?,?,?,?,?)", (value_id,guid_key,f'Value{i:03d}',1,b'x',f'interface-value-{i}'))
              value_id += 1

          db.commit()
          db.close()
          '@ | python -

          .\bin\nylon-semantic.exe .\semantic-smoke.db --plan-only
          if ($LASTEXITCODE -ne 0) { throw "semantic planner smoke failed" }

          .\bin\nylon-semantic-classify.exe .\semantic-smoke.db
          if ($LASTEXITCODE -ne 0) { throw "semantic preclassifier smoke failed" }

          @'
          import sqlite3
          src = sqlite3.connect(r"semantic-smoke.db")
          expected = src.execute("SELECT (SELECT COUNT(*) FROM registry_keys)+(SELECT COUNT(*) FROM registry_values)").fetchone()[0]
          src.close()
          m = sqlite3.connect(r"semantic-smoke.map.db")
          planned = m.execute("SELECT SUM(source_count) FROM lift_jobs").fetchone()[0]
          jobs = m.execute("SELECT COUNT(*) FROM lift_jobs").fetchone()[0]
          deterministic = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE status=2").fetchone()[0]
          preclassified = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE deterministic_kind='component' AND status=0").fetchone()[0]
          pending_ai = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE deterministic_kind='' AND status=0").fetchone()[0]
          model = m.execute("SELECT value FROM metadata WHERE key='model_name'").fetchone()[0]
          m.close()
          if planned != expected:
              raise SystemExit(f"coverage mismatch: planned={planned} expected={expected}")
          if jobs < 1 or deterministic < 1 or preclassified < 1 or pending_ai < 1:
              raise SystemExit(f"unexpected planner output: jobs={jobs} deterministic={deterministic} preclassified={preclassified} pending_ai={pending_ai}")
          if model != 'Qwen3.5-4B-Q8_0':
              raise SystemExit(f"unexpected pinned model {model}")
          print(f"semantic planner smoke passed: {jobs} jobs, {planned} sources, {preclassified} newly preclassified, {pending_ai} model jobs")
          '@ | python -

          @'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          delta = {
              "group_kind": "registry_configuration",
              "group_label": "Normalized registry configuration",
              "summary": "Synthetic CI semantic lift result.",
              "entities": [],
              "relationships": [],
              "unresolved": []
          }

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass
              def do_GET(self):
                  if self.path == '/health':
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                  else:
                      body = b'{}'
                      self.send_response(404)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0'))
                  if length:
                      self.rfile.read(length)
                  if self.path == '/v1/chat/completions':
                      payload = {"choices": [{"message": {"content": json.dumps(delta)}}]}
                      body = json.dumps(payload).encode('utf-8')
                      self.send_response(200)
                  else:
                      body = b'{}'
                      self.send_response(404)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          ThreadingHTTPServer(('127.0.0.1', 51827), Handler).serve_forever()
          '@ | Set-Content -Encoding UTF8 fake-llama.py

          $fake = Start-Process python -ArgumentList ".\fake-llama.py" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 100
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:51827/health" -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "fake llama server failed to start" }

            # This second invocation must resume the existing plan, commit the
            # preclassified work without model calls, and send only unknown work
            # through the OpenAI-compatible local model API.
            .\bin\nylon-semantic.exe .\semantic-smoke.db
            if ($LASTEXITCODE -ne 0) { throw "full semantic pipeline smoke failed" }
          }
          finally {
            if (-not $fake.HasExited) { Stop-Process -Id $fake.Id -Force }
          }

          .\bin\nylon-semantic-link.exe .\semantic-smoke.db
          if ($LASTEXITCODE -ne 0) { throw "semantic hierarchy linker smoke failed" }

          @'
          import sqlite3
          m = sqlite3.connect(r"semantic-smoke.map.db")
          complete = m.execute("SELECT value FROM metadata WHERE key='complete'").fetchone()[0]
          hierarchy_complete = m.execute("SELECT value FROM metadata WHERE key='hierarchy_complete'").fetchone()[0]
          source_coverage_complete = m.execute("SELECT value FROM metadata WHERE key='source_coverage_complete'").fetchone()[0]
          failed = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE status=4").fetchone()[0]
          pending = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE status NOT IN (2,3)").fetchone()[0]
          ai = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE status=3").fetchone()[0]
          deterministic = m.execute("SELECT COUNT(*) FROM lift_jobs WHERE status=2").fetchone()[0]
          nodes = m.execute("SELECT COUNT(*) FROM semantic_nodes").fetchone()[0]
          sources = m.execute("SELECT SUM(source_count) FROM lift_jobs").fetchone()[0]
          covered = m.execute("SELECT SUM(CASE WHEN status IN (2,3) THEN source_count ELSE 0 END) FROM lift_jobs").fetchone()[0]
          distinct_refs = m.execute("SELECT COUNT(DISTINCT source_ref) FROM semantic_sources WHERE source_ref LIKE 'rk:%' OR source_ref LIKE 'rv:%'").fetchone()[0]
          registry_root = m.execute("SELECT id FROM semantic_nodes WHERE stable_key='system:registry' AND job_id=0").fetchone()
          hive_nodes = m.execute("SELECT COUNT(*) FROM semantic_nodes WHERE job_id=0 AND stable_key LIKE 'system:hive:%'").fetchone()[0]
          hierarchy_edges = m.execute("SELECT COUNT(*) FROM semantic_edges WHERE job_id=0 AND relation='contains'").fetchone()[0]
          orphan_groups = m.execute("SELECT COUNT(*) FROM semantic_nodes WHERE job_id<>0 AND local_id='group' AND parent_id IS NULL").fetchone()[0]
          m.close()
          if complete != '1' or hierarchy_complete != '1' or source_coverage_complete != '1' or failed or pending:
              raise SystemExit(f"semantic map incomplete: complete={complete} hierarchy={hierarchy_complete} source_coverage={source_coverage_complete} failed={failed} pending={pending}")
          if ai < 1 or deterministic < 1 or nodes < 1:
              raise SystemExit(f"semantic passes missing: ai={ai} deterministic={deterministic} nodes={nodes}")
          if covered != sources or distinct_refs != sources:
              raise SystemExit(f"semantic source coverage incomplete: jobs={covered}/{sources} refs={distinct_refs}/{sources}")
          if not registry_root or hive_nodes != 1 or hierarchy_edges < 2 or orphan_groups != 0:
              raise SystemExit(f"semantic hierarchy invalid: root={registry_root} hives={hive_nodes} edges={hierarchy_edges} orphans={orphan_groups}")
          print(f"full semantic pipeline smoke passed: {deterministic} deterministic + {ai} model jobs; {distinct_refs}/{sources} raw sources linked; hierarchy linked")
          '@ | python -
